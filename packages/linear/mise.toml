[tasks.fonts]
description = "Download Geist and convert it to the static fonts Typst needs"
dir = "{{config_root}}/fonts"
sources = ["convert.py", "uv.lock"]
outputs = ["Geist-400.ttf", "GeistMono-700.ttf"]
run = "uv run --locked convert.py"

[tasks.format]
description = "Format the theme with typstyle"
run = "typstyle -i ."

[tasks.format-check]
description = "Check the theme's formatting"
run = "typstyle --check ."
