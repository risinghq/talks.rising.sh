# Define un "upstream" que agrupa los servidores de la aplicación.
# En nuestro caso, solo es Gunicorn corriendo en localhost:8000.
upstream app_server {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    # Nginx escuchará en el puerto 80, el puerto estándar para HTTP.
    listen 80;
    server_name _;

    # Si la URL de la petición comienza con /static/, Nginx servirá el archivo
    # directamente desde el sistema de archivos. Esto es mucho más eficiente que Django.
    location /static/ {
        alias /app/staticfiles/;
    }

    # Para cualquier otra petición (la lógica de la app)...
    location / {
        # Pasamos cabeceras importantes al servidor de la aplicación (Gunicorn).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ... la reenviamos a Gunicorn.
        proxy_pass http://app_server;
    }
}
