monorepo_root = true

[monorepo]
config_roots = ["talks/deploy-django/proyecto1"]

[tools]
bun = "1.4.4"
uv = "0.13.6"

[tasks.install]
description = "Install the Bun workspaces from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Serve the site with hot reload"
depends = ["install"]
run = "bun run --cwd site dev"

[tasks.check]
description = "Typecheck, find dead code and check formatting"
depends = ["install", "//...:format-check"]
run = ["bun run typecheck", "bun run lint:dead"]

[tasks.build]
description = "Build the static site into site/out"
depends = ["install"]
run = "bun run --cwd site build"

[tasks.deploy]
description = "Build the site and upload it to the Worker"
depends = ["build"]
run = "bun run --cwd worker deploy"
