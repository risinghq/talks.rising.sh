[tools]
typst = "0.13.1"
typstyle = "0.13.18"
uv = "0.9.5"
ruff = "0.14.1"
docker-cli = "28.5.1"
terraform = "1.13.4"
gh = "2.82.1"

# Font & formatting tasks

[tasks.fonts]
description = "Convert variable fonts to static fonts for Typst"
alias = "fonts"
run = "cd fonts && uv sync --quiet && uv run convert.py"

[tasks.format]
description = "Format Typst files with typstyle"
alias = "f"
run = "typstyle -i ."

[tasks.format-check]
description = "Check formatting without modifying files"
run = "typstyle --check ."

# Compilation & watching tasks

[tasks.compile]
description = "Compile Typst document to PDF"
alias = "c"
run = "typst compile --font-path fonts example.typ"

[tasks.compile-html]
description = "Compile Typst document to HTML (experimental)"
alias = "ch"
run = [
  "typst compile --features html --font-path fonts --format html example.typ example.html",
]

[tasks.watch]
description = "Watch and auto-compile on changes (PDF)"
alias = "w"
run = "typst watch --font-path fonts example.typ"

[tasks.watch-html]
description = "Watch Typst document and serve HTML with live reload (experimental)"
alias = "wh"
run = [
  "typst watch --features html --font-path fonts --format html --port 3000 example.typ example.html",
]

# Development & live preview

[tasks.dev]
description = "Development mode with file watching (PDF)"
alias = "d"
run = "typst watch --font-path fonts example.typ --open"

[tasks.dev-html]
description = "Development mode with HTML live server (experimental)"
alias = "dh"
run = [
  "typst watch --features html --font-path fonts --format html --port 3000 --open example.typ example.html",
]

# Package management

[tasks.pkg-install]
description = "Install linear package to local Typst packages"
alias = "install"
run = "pwsh scripts/install-local-pkg.ps1"

[tasks.pkg-uninstall]
description = "Uninstall linear package from local Typst packages"
alias = "uninstall"
run = "pwsh scripts/uninstall-local-pkg.ps1"

# Utility & CI tasks

[tasks.clean]
description = "Remove generated PDF and HTML files"
run = [
  "rm -f example.pdf",
  "rm -f main.pdf",
  "rm -f *.pdf",
  "rm -f example.html",
]

[tasks.export]
description = "Export requirements.txt for the Python examples"
run = [
  "cd python && uv export --format requirements-txt --no-hashes --no-header --no-dev --no-annotate --output-file requirements.txt",
]

[tasks.check]
description = "Run all checks (format, compile)"
depends = ["format-check", "compile"]

[tasks.ci]
description = "Run continuous integration checks"
run = ["mise run format-check", "mise run compile"]
