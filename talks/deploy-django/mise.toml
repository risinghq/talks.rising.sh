# The theme lives in packages/linear, so Typst's root is the repository.
[env]
TYPST_ROOT = "{{config_root}}/../.."
TYPST_FONT_PATHS = "{{config_root}}/../../packages/linear/fonts"

[tasks.format]
description = "Format the talk with typstyle"
run = "typstyle -i main.typ"

[tasks.format-check]
description = "Check the talk's formatting"
run = "typstyle --check main.typ"

[tasks.compile]
description = "Compile the talk to main.pdf"
depends = ["//packages/linear:fonts"]
run = "typst compile main.typ"

[tasks.watch]
description = "Recompile main.pdf on every change and open it"
depends = ["//packages/linear:fonts"]
run = "typst watch main.typ --open"
