[tools]
ruff = "0.14.1"
docker-cli = "28.5.1"
terraform = "1.13.4"

# The theme lives in packages/linear, so Typst's root is the repository.
[env]
TYPST_ROOT = "{{config_root}}/../.."
TYPST_FONT_PATHS = "{{config_root}}/../../packages/linear/fonts"

[tasks.format]
description = "Format the talk with typstyle"
alias = "f"
run = "typstyle -i main.typ"

[tasks.format-check]
description = "Check formatting without modifying files"
run = "typstyle --check main.typ"

[tasks.compile]
description = "Compile Typst document to PDF"
alias = "c"
run = "typst compile main.typ"

[tasks.compile-html]
description = "Compile Typst document to HTML (experimental)"
alias = "ch"
run = "typst compile --features html --format html main.typ main.html"

[tasks.watch]
description = "Watch and auto-compile on changes (PDF)"
alias = "w"
run = "typst watch main.typ"

[tasks.watch-html]
description = "Watch Typst document and serve HTML with live reload (experimental)"
alias = "wh"
run = "typst watch --features html --format html --port 3000 main.typ main.html"

[tasks.dev]
description = "Development mode with file watching (PDF)"
alias = "d"
run = "typst watch main.typ --open"

[tasks.dev-html]
description = "Development mode with HTML live server (experimental)"
alias = "dh"
run = "typst watch --features html --format html --port 3000 --open main.typ main.html"

[tasks.clean]
description = "Remove generated PDF and HTML files"
run = ["rm -f *.pdf", "rm -f main.html"]

[tasks.export]
description = "Export requirements.txt for the Python examples"
run = "cd python && uv export --format requirements-txt --no-hashes --no-header --no-dev --no-annotate --output-file requirements.txt"

[tasks.check]
description = "Run all checks (format, compile)"
depends = ["format-check", "compile"]
